name: Apply completion policy patch

on:
  push:
    branches:
      - feat/complete-runtime-and-policy-coverage
    paths:
      - "scripts/apply_completion_policy_patch.py"
      - ".github/workflows/apply-completion-policy-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-completion-policy-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/complete-runtime-and-policy-coverage

      - name: Apply deterministic migration
        run: python3 scripts/apply_completion_policy_patch.py

      - name: Commit migrated sources
        run: |
          set -eu
          git diff --check
          git diff --exit-code -- scripts/apply_completion_policy_patch.py .github/workflows/apply-completion-policy-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check_static.py scripts/test_optional_runtime.py
          git commit -m "test: close completion policy gaps"
          git push origin HEAD:feat/complete-runtime-and-policy-coverage
