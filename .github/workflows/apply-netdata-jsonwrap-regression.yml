name: Apply Netdata jsonwrap regression

on:
  push:
    branches:
      - feat/complete-runtime-and-policy-coverage
    paths:
      - "scripts/apply_netdata_jsonwrap_regression.py"
      - ".github/workflows/apply-netdata-jsonwrap-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-netdata-jsonwrap-regression
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/complete-runtime-and-policy-coverage

      - name: Apply regression fixture
        run: python3 scripts/apply_netdata_jsonwrap_regression.py

      - name: Commit test-only change
        run: |
          set -eu
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/test_optional_runtime.py
          git commit -m "test: reproduce Netdata jsonwrap response"
          git push origin HEAD:feat/complete-runtime-and-policy-coverage
