name: Optional runtime smoke

on:
  push:
    branches:
      - main
    paths:
      - "compose.yaml"
      - ".env.example"
      - "Makefile"
      - "config/k6/**"
      - "scripts/check_optional_runtime.sh"
      - "scripts/check_optional_runtime_policy.py"
      - "scripts/test_optional_runtime.py"
      - ".github/workflows/optional-runtime.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - ".env.example"
      - "Makefile"
      - "config/k6/**"
      - "scripts/check_optional_runtime.sh"
      - "scripts/check_optional_runtime_policy.py"
      - "scripts/test_optional_runtime.py"
      - ".github/workflows/optional-runtime.yml"
  schedule:
    - cron: "11 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify Netdata and k6 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version

      - name: Run isolated optional runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          make check-optional-runtime 2>&1 | tee optional-runtime-smoke.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: optional-runtime-smoke-log
          path: optional-runtime-smoke.log
          if-no-files-found: error
          retention-days: 3
