name: Community runtime

on:
  push:
    branches:
      - main
    paths:
      - "compose.yaml"
      - "modules/core/**"
      - "modules/uptime/**"
      - "modules/dashboard/**"
      - "modules/logs/**"
      - "config/homepage/**"
      - "scripts/check_community_services.py"
      - "scripts/check_community_runtime.sh"
      - "Makefile"
      - ".github/workflows/community-runtime.yml"
  pull_request:
    paths:
      - "compose.yaml"
      - "modules/core/**"
      - "modules/uptime/**"
      - "modules/dashboard/**"
      - "modules/logs/**"
      - "config/homepage/**"
      - "scripts/check_community_services.py"
      - "scripts/check_community_runtime.sh"
      - "Makefile"
      - ".github/workflows/community-runtime.yml"
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Uptime Kuma, Homepage, and Dozzle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version

      - name: Run isolated community runtime test
        shell: bash
        run: |
          set -o pipefail
          make check-community-runtime 2>&1 | tee community-runtime.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-runtime-log
          path: community-runtime.log
          if-no-files-found: error
          retention-days: 3
