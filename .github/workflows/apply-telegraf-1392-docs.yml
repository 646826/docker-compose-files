name: Apply Telegraf 1.39.2 documentation

on:
  push:
    branches:
      - feat/community-homelab-platform
    paths:
      - "scripts/apply_telegraf_1392_docs.py"
      - ".github/workflows/apply-telegraf-1392-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-telegraf-1392-docs
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/community-homelab-platform

      - name: Apply deterministic migration
        run: python3 scripts/apply_telegraf_1392_docs.py

      - name: Remove one-time transport
        run: |
          rm -f scripts/apply_telegraf_1392_docs.py
          rm -f .github/workflows/apply-telegraf-1392-docs.yml

      - name: Commit migrated documentation
        run: |
          set -eu
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize Telegraf 1.39.2"
          git push origin HEAD:feat/community-homelab-platform
