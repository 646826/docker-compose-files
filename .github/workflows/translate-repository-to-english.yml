name: Translate repository to English

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/prepare_translation_script.py
      - scripts/translate_repository_to_english.py
      - .github/workflows/translate-repository-to-english.yml

permissions:
  contents: write

jobs:
  translate:
    name: Translate and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare ASCII-only translation inputs
        run: python3 scripts/prepare_translation_script.py

      - name: Translate remaining content
        run: python3 scripts/translate_repository_to_english.py

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Commit translation
        shell: bash
        run: |
          paths=(
            README.md
            scripts/check_runtime_policy.py
            scripts/check_backup_policy.py
            scripts/check_static.py
            scripts/translate_repository_to_english.py
            docs/superpowers/plans/2026-07-20-consistency-and-simplification.md
            docs/superpowers/specs/2026-07-20-consistency-and-simplification-design.md
          )

          if git diff --quiet -- "${paths[@]}"; then
            echo "No translation changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Translate repository content to English"
          git push origin "HEAD:${{ github.head_ref }}"
