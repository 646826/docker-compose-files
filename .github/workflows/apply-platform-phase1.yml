name: Apply community platform phase 1

on:
  push:
    branches:
      - feat/community-homelab-platform
    paths:
      - "scripts/apply_platform_phase1.py"
      - ".github/workflows/apply-platform-phase1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-community-platform-phase-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/community-homelab-platform

      - name: Apply deterministic migration
        run: python3 scripts/apply_platform_phase1.py

      - name: Verify generated diff
        run: |
          set -eu
          git diff --check
          python3 -m py_compile scripts/doctor.py scripts/check_modules.py scripts/test_doctor.py

      - name: Commit generated sources
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            compose.yaml modules scripts/doctor.py scripts/check.sh scripts/check_images.py \
            scripts/check_runtime.sh scripts/check_iot_runtime.sh scripts/check_optional_runtime.sh \
            scripts/check_static.py scripts/check_iot_runtime_policy.py scripts/check_optional_runtime_policy.py \
            Makefile README.md .github/workflows
          git commit -m "refactor: modularize Compose and add doctor"
          git push origin HEAD:feat/community-homelab-platform
