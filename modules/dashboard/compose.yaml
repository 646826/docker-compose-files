x-module-owner: dashboard

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.1
    profiles: [dashboard]
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${BASE_DOMAIN:-localhost}
      HOMEPAGE_VAR_BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      HOMEPAGE_VAR_HOST_ADDRESS: ${HOMELAB_HOST_ADDRESS:-127.0.0.1}
      HOMEPAGE_VAR_NETDATA_PORT: ${NETDATA_PORT:-19999}
      HOMEPAGE_VAR_MQTT_PORT: ${MQTT_PORT:-1883}
    volumes:
      - ../../config/homepage:/app/config:ro
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${HOMELAB_PROJECT_NAME:-homelab}_proxy
      traefik.http.routers.homepage.rule: Host(`home.${BASE_DOMAIN:-localhost}`)
      traefik.http.routers.homepage.entrypoints: web
      traefik.http.routers.homepage.middlewares: ${AUTH_MIDDLEWARE:-local-auth@docker}
      traefik.http.services.homepage.loadbalancer.server.port: "3000"
