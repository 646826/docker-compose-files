x-module-owner: monitoring

services:
  influxdb:
    image: influxdb:2.9.1-alpine
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb_username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb_password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb_token
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-home-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-home-bucket}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0}
    secrets:
      - influxdb_username
      - influxdb_password
      - influxdb_token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - proxy
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${HOMELAB_PROJECT_NAME:-homelab}_proxy
      traefik.http.routers.influxdb.rule: Host(`influxdb.${BASE_DOMAIN:-localhost}`)
      traefik.http.routers.influxdb.entrypoints: web
      traefik.http.services.influxdb.loadbalancer.server.port: "8086"

  telegraf:
    image: telegraf:1.39.2-alpine
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    user: telegraf
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_MOUNT_PREFIX: /hostfs
      INFLUXDB_ORG: ${INFLUXDB_ORG:-home-org}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-home-bucket}
    secrets:
      - influxdb_token
    volumes:
      - ../../config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /:/hostfs:ro
    networks:
      - backend
      - socket
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -euc
      - |
        export INFLUXDB_TOKEN="$$(cat /run/secrets/influxdb_token)"
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-home-org}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-home-bucket}
    secrets:
      - grafana_admin_password
      - influxdb_token
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - proxy
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${HOMELAB_PROJECT_NAME:-homelab}_proxy
      traefik.http.routers.grafana.rule: Host(`grafana.${BASE_DOMAIN:-localhost}`)
      traefik.http.routers.grafana.entrypoints: web
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  netdata:
    image: netdata/netdata:v2.10.3
    profiles: [netdata]
    restart: unless-stopped
    hostname: ${NETDATA_HOSTNAME:-homelab}
    environment:
      NETDATA_LISTENER_PORT: ${NETDATA_PORT:-19999}
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro

  k6:
    image: grafana/k6:2.1.0
    profiles: [test]
    depends_on:
      - whoami
    command: run /scripts/smoke.js
    environment:
      TARGET_URL: ${K6_TARGET_URL:-http://whoami}
    volumes:
      - ../../config/k6:/scripts:ro
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
