x-module-owner: core

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      SERVICES: "1"
      TASKS: "1"
      VERSION: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  traefik:
    image: traefik:v3.7.8
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${HOMELAB_PROJECT_NAME:-homelab}_proxy
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "${HTTP_HOST_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
    secrets:
      - traefik_users
    networks:
      - proxy
      - socket
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${HOMELAB_PROJECT_NAME:-homelab}_proxy
      traefik.http.routers.traefik.rule: Host(`traefik.${BASE_DOMAIN:-localhost}`)
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: local-auth
      traefik.http.middlewares.local-auth.basicauth.usersfile: /run/secrets/traefik_users

  whoami:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${HOMELAB_PROJECT_NAME:-homelab}_proxy
      traefik.http.routers.whoami.rule: Host(`whoami.${BASE_DOMAIN:-localhost}`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.routers.whoami.middlewares: local-auth@docker
      traefik.http.services.whoami.loadbalancer.server.port: "80"
